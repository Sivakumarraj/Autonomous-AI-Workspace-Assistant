line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are handled by the formatter, not enforced here
    "B008",  # FastAPI's Depends()/File() defaults are the documented idiom
]

[lint.per-file-ignores]
# main.py sets the Windows event-loop policy before its imports on purpose.
"app/main.py" = ["E402"]
