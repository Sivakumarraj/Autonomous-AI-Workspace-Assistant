# Local / self-hosted full stack.
#
#   cd docker && docker compose up --build
#
# Frontend: http://localhost:3000   Backend: http://localhost:8000/docs
#
# Put GEMINI_API_KEY and SECRET_KEY in a .env file next to this one; without a
# key the stack still runs and every non-AI endpoint works.

services:
  backend:
    build:
      # Repository root, so the Dockerfile can see backend/.
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      DEBUG: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Must be set when DEBUG=false; startup refuses the shipped default.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in docker/.env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # One volume for everything stateful. The previous setup mounted three
      # host paths but not the SQLite database, so all metadata was lost on
      # every restart.
      - backend_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        # Baked into the client bundle at build time. This is the URL the
        # *browser* uses, so it must be reachable from the host — not the
        # compose-internal `http://backend:8000`.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
